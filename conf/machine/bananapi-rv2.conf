#@TYPE: Machine
#@NAME: Banana Pi BPI-RV2
#@SOC: Siflower SF21H8898
#@DESCRIPTION: Machine configuration for Banana Pi BPI-RV2 with OpenWrt Linux kernel
#@MAINTAINER: Marcel Ziswiler <marcel@ziswiler.com>

# Extend the list from riscv-common.inc
MACHINE_FEATURES:append = " usb"

require conf/machine/include/riscv/tune-riscv.inc

KERNEL_CLASSES = "kernel"
KERNEL_IMAGETYPE = "Image"

KERNEL_DTB_BASENAME = "sf21h8898_bananapi_bpi-rv2-nand.dtb"
KERNEL_DEVICETREE ?= "siflower/${KERNEL_DTB_BASENAME}"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-bpi-rv2-openwrt"

# There is no upstream U-Boot support for Siflower SF21H8898 yet
# We rely on booting downstream U-Boot being present in SPI NAND/NOR flash
# Using QEMU machine for now just to generate uboot-extlinux-config
UBOOT_MACHINE ?= "qemu-riscv64_defconfig"

PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot"

RISCV_SBI_PLAT = "generic"

SERIAL_CONSOLES = "115200;ttyS0"

IMAGE_FSTYPES += "wic.xz wic.bmap ext4"

IMAGE_BOOT_FILES = "${KERNEL_IMAGETYPE} \
                    ${KERNEL_DTB_BASENAME};${KERNEL_DEVICETREE} \
"

# Don't include kernels and DTBs in standard images
RRECOMMENDS:${KERNEL_PACKAGE_NAME}-base = ""
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "kernel-image-image"
# Install kernel modules by default
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append = " kernel-modules"

WIC_CREATE_EXTRA_ARGS ?= "--no-fstab-update"
WKS_FILE_DEPENDS:append = " u-boot"
WKS_FILE ?= "bananapi-rv2.wks"
